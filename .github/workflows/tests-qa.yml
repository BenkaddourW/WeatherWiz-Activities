name: Pipeline QA - Tests API

# 1. QUAND est-ce que ce script s'exécute ?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. QUE doit-il faire ?
jobs:
  tests-automatises:
    # On choisit un serveur Linux gratuit chez GitHub
    runs-on: ubuntu-latest

    steps:
    # Étape A : Le serveur télécharge ton code depuis ton GitHub
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    # Étape B : Le serveur installe Python 3.12 (comme sur ton PC)
    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Étape C : Le serveur installe tes librairies (Flask et Pytest)
    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pytest
        pip install Flask pytest 

    # Étape D : L'instant de vérité, le serveur lance ton script de test !
    - name: 🧪 Lancement des tests Pytest
      run: |
        pytest